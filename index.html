<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central Comercial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M3 5h26l-10 12v9l-6 3V17z%22 fill=%22%232A47D9%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho de navegação à esquerda (vira faixa no celular) + área de trabalho; gaveta lateral para o lead */
:root{
  --bg:#EEF1F7; --panel:#FFFFFF; --panel2:#F6F8FC; --ink:#151B2E; --mute:#5C6682; --line:#D9DFEB;
  --accent:#2A47D9; --accent-ink:#FFFFFF; --accent-soft:#E4E9FD;
  --good:#12784A; --good-soft:#DCF2E6; --warn:#9A5600; --warn-soft:#FBEACF; --bad:#BE3328; --bad-soft:#FADFDB;
  --super:#7428D1; --super-soft:#EEE2FC;
  --shadow:0 1px 2px rgba(21,27,46,.06),0 8px 24px rgba(21,27,46,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --panel:#151A2B; --panel2:#1A2033; --ink:#E7EAF4; --mute:#97A0BA; --line:#2A3149;
  --accent:#8196FF; --accent-ink:#0D1120; --accent-soft:#222B54;
  --good:#4DC48B; --good-soft:#123021; --warn:#EFA84D; --warn-soft:#33250F; --bad:#FF7B6F; --bad-soft:#3A1714;
  --super:#BA8DFF; --super-soft:#2B1C45; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1120; --panel:#151A2B; --panel2:#1A2033; --ink:#E7EAF4; --mute:#97A0BA; --line:#2A3149;
  --accent:#8196FF; --accent-ink:#0D1120; --accent-soft:#222B54;
  --good:#4DC48B; --good-soft:#123021; --warn:#EFA84D; --warn-soft:#33250F; --bad:#FF7B6F; --bad-soft:#3A1714;
  --super:#BA8DFF; --super-soft:#2B1C45; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:600;font-family:var(--f-body)}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:18px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
.brand span{color:var(--mute);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;padding:1px 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;text-align:center}
.badge.s{background:var(--super)}
.rail-foot{margin-top:auto;color:var(--mute);font-size:12px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vh .sub{color:var(--mute);margin-top:4px;max-width:70ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block>header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.block .hint{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.count{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-family:var(--f-body);font-weight:600;color:var(--mute);vertical-align:2px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--panel2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}

input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:14px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input{flex:1 1 180px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.super{background:var(--super-soft);color:var(--super);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.alert{padding:10px 12px;border-radius:8px;font-size:13px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--good-soft);color:var(--good)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--mute);padding:8px 0}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}

/* listas de ação (Hoje) */
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .who{display:flex;flex-direction:column;min-width:0}
.item .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .who span{color:var(--mute);font-size:12.5px}
.item.late .who span{color:var(--bad)}
.item>button.whole{all:unset;cursor:pointer;display:flex;flex:1;min-width:0;flex-direction:column}
.item>button.whole:focus-visible{outline:2px solid var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:12px;color:var(--mute);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--mute)}
.stat.hot{border-color:var(--super);box-shadow:inset 3px 0 0 var(--super)}
.check{display:flex;flex-direction:column;gap:6px;counter-reset:c}
.check a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:6px 0}
.check a i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.check a.done{color:var(--mute);text-decoration:line-through}
.check a.done i{background:var(--good);border-color:var(--good);color:#fff}

/* funil kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:180px;max-height:calc(100vh - 210px)}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col>header{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.col>header .t{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.col>header small{color:var(--mute);font-size:11.5px;line-height:1.3}
.col .cards{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.col[data-etapa="ganho"]>header{box-shadow:inset 0 3px 0 var(--good);border-radius:12px 12px 0 0}
.col[data-etapa="perdido"]>header{box-shadow:inset 0 3px 0 var(--bad);border-radius:12px 12px 0 0}
.col[data-etapa="noshow"]>header{box-shadow:inset 0 3px 0 var(--warn);border-radius:12px 12px 0 0}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:grab;min-width:0}
.card:hover{border-color:var(--mute)}
.card:focus-visible{outline:2px solid var(--accent)}
.card.super{box-shadow:inset 3px 0 0 var(--super)}
.card-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.card-top b{overflow-wrap:anywhere}
.card-meta{color:var(--mute);font-size:12px}
.card-next{font-size:12.5px;color:var(--ink)}
.card-next.late{color:var(--bad);font-weight:600}
.card-val{font-family:var(--f-display);font-weight:700;color:var(--good)}

/* tabela */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;background:var(--panel2)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
table.plain tbody tr{cursor:default}

/* metas */
.meta{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.meta:first-of-type{border-top:0;padding-top:0}
.meta-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meta-head .v{font-family:var(--f-display);font-size:24px;font-weight:700}
.bar{position:relative;height:14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);margin-top:4px;margin-bottom:22px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar .fill.bad{background:var(--bad)}.bar .fill.warn{background:var(--warn)}.bar .fill.good{background:var(--good)}.bar .fill.super{background:var(--super)}
.bar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.bar .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.bar .pace{position:absolute;top:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--mute);transform:translateX(-6px)}
.meta .why{font-size:13px;color:var(--mute)}

/* números */
.costs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:12px;align-items:center}
.fstep .lbl{font-weight:600}
.fstep .lbl small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.fbar{height:28px;border-radius:6px;background:var(--accent);min-width:2px;display:flex;align-items:center;padding:0 8px;color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums}
.fbar.z{background:var(--line);color:var(--mute)}
.fconv{font-size:12.5px;color:var(--mute);text-align:right}
.fconv b{color:var(--ink)}
.fconv .ok{color:var(--good)}.fconv .no{color:var(--bad)}

/* aprovações */
.aprov{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.aprov.pendente{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.aprov-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.aprov-meta{color:var(--mute);font-size:12.5px}
.quote{font-style:italic;color:var(--mute)}
.script{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px}

/* gaveta e modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--panel);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer>header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .body{padding:16px 18px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button.on.ganho{background:var(--good);border-color:var(--good);color:#fff}
.seg button.on.perdido{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.super{background:var(--super);border-color:var(--super);color:#fff}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist div{display:flex;flex-direction:column;border-left:2px solid var(--line);padding-left:10px}
.hist small{color:var(--mute)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

#auth{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-box{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.resp{display:grid;gap:2px;margin:0}.resp dt{font-size:12px;color:var(--mute);margin-top:6px}.resp dd{margin:0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
  .brand span,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap}
  .grid2,.grid3,.grid21{grid-template-columns:minmax(0,1fr)}
  .fstep{grid-template-columns:96px minmax(0,1fr) 86px;gap:8px}
}
@media (max-width:520px){h1{font-size:22px}.stat .v{font-size:23px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="auth"><p class="hint">Carregando…</p></div>
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand"><b>Central Comercial</b><span>Do lead à venda, todo dia</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main id="main"><div class="wrap"><p class="empty">Carregando…</p></div></main>
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const ETAPAS=[
  {id:'novo',nome:'Novo',dica:'Chegou agora. Super MQL: chamar na hora.'},
  {id:'contato',nome:'Aquecimento',dica:'Acompanhamento no privado até a aula.'},
  {id:'agendado',nome:'Sessão agendada',dica:'Sessão estratégica marcada.'},
  {id:'noshow',nome:'No-show',dica:'Não apareceu. Remarcar ou encerrar.'},
  {id:'compareceu',nome:'Compareceu',dica:'Fez a sessão. Proposta na mesa.'},
  {id:'negociacao',nome:'Negociação',dica:'Condição em discussão ou com o gerente.'},
  {id:'ganho',nome:'Venda',dica:'Fechou.'},
  {id:'perdido',nome:'Perdido',dica:'Encerrado, sempre com motivo.'}
];
const ET=Object.fromEntries(ETAPAS.map(e=>[e.id,e]));
const FECHADAS=['ganho','perdido'];
const QUAL={lead:'Lead',mql:'MQL',super:'Super MQL'};
const METAS_DEF=[
  {k:'vendas',nome:'Vendas',fmt:'n',calc:c=>c.vendas},
  {k:'faturamento',nome:'Faturamento',fmt:'r',calc:c=>c.fat},
  {k:'agendados',nome:'Sessões agendadas',fmt:'n',calc:c=>c.ag},
  {k:'compareceram',nome:'Comparecimentos',fmt:'n',calc:c=>c.co}
];
const DEFAULTS={

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o??null));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const NUM=new Intl.NumberFormat('pt-BR');
const fmtR=v=>Number.isFinite(v)?BRL.format(v):'—';
const fmtN=v=>Number.isFinite(v)?NUM.format(Math.round(v)):'—';
const fmtP=v=>Number.isFinite(v)?(v*100).toFixed(v<0.1&&v>0?1:0).replace('.',',')+'%':'—';
const fmtV=(v,f)=>f==='r'?fmtR(v):fmtN(v);
const ratio=(a,b)=>b>0?a/b:NaN;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:0;};
const pad=n=>String(n).padStart(2,'0');
const nowIso=()=>new Date().toISOString();
const dk=d=>{if(!d)return '';const x=new Date(d);if(isNaN(x))return '';return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());};
const todayK=()=>dk(new Date());
const kDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>{const x=kDate(k);x.setDate(x.getDate()+n);return dk(x);};
const weekStartK=(k=todayK())=>addDays(k,-((kDate(k).getDay()+6)%7));
const inK=(iso,a,b)=>{const k=dk(iso);return !!k&&k>=a&&k<=b;};
const fmtDia=k=>kDate(k).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const fmtCurto=k=>k?k.slice(8,10)+'/'+k.slice(5,7):'';
const fmtHora=iso=>{const x=new Date(iso);return pad(x.getHours())+':'+pad(x.getMinutes());};
const fmtQuando=iso=>{if(!iso)return '';const k=dk(iso),t=todayK(),h=fmtHora(iso);if(k===t)return 'hoje '+h;if(k===addDays(t,1))return 'amanhã '+h;if(k===addDays(t,-1))return 'ontem '+h;return fmtCurto(k)+' '+h;};
const idade=iso=>{if(!iso)return '';const m=Math.max(0,Math.floor((Date.now()-new Date(iso))/60000));if(m<60)return m+' min';const h=Math.floor(m/60);if(h<48)return h+' h';return Math.floor(h/24)+' dias';};
const toLocalInput=iso=>{if(!iso)return '';const x=new Date(iso);if(isNaN(x))return '';return dk(x)+'T'+pad(x.getHours())+':'+pad(x.getMinutes());};
const fromLocalInput=v=>v?new Date(v).toISOString():'';
const rid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();

const chains={};
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'Não foi possível salvar. Talvez você só tenha acesso de leitura.';
  if(c==='quota_exceeded')return 'O banco está cheio. Apague registros antigos para continuar.';
  if(c==='resource_exhausted')return 'Muitas gravações seguidas. Espere alguns segundos.';
  if(c==='revoked'||c==='not_granted')return 'Seu acesso a esta página mudou. Recarregue.';
  return 'Falha ao salvar. Tente de novo.';
}
function saveDoc(path,data,mode){
  if(!S.db){toast('Sem conexão com o servidor.','bad');return Promise.reject();}
  const prev=chains[path]||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>mode==='update'?S.db.doc(path).update(data):S.db.doc(path).set(data));
  chains[path]=p;
  p.catch(e=>{toast(errMsg(e),'bad');if(e&&e.code==='invalid_argument'&&S.canWriteUnknown){S.canWrite=false;renderAll();}});
  return p;
}
function upLead(id,patch,hist){
  const L=leadById(id); if(!L)return;
  patch.atualizadoEm=nowIso();
  if(hist){patch.hist=(L.hist||[]).concat([{em:nowIso(),uid:S.uid||null,...hist}]).slice(-120);}
  return saveDoc('leads/'+id,patch,'update');
}
function moveStage(id,etapa,extra,nota){
  const L=leadById(id); if(!L||L.etapa===etapa)return;
  const m={...(L.marcos||{})};
  if(FECHADAS.includes(L.etapa)&&!FECHADAS.includes(etapa)) m[L.etapa]=null;
  if(FECHADAS.includes(etapa)) m[etapa]=nowIso(); else if(etapa!=='novo'&&!m[etapa]) m[etapa]=nowIso();
  const patch={etapa,aberto:!FECHADAS.includes(etapa),marcos:m,...(extra||{})};
  if(!FECHADAS.includes(etapa)){patch.motivo='';}
  upLead(id,patch,{tipo:'etapa',de:L.etapa,para:etapa,txt:nota||(extra&&extra.motivo)||''});
  if(etapa==='agendado'&&!L.sessaoEm) toast('Coloque a data da sessão no lead.');
}

/* ---------- cálculos ---------- */
function periodo(p){const t=todayK();switch(p){
  case 'hoje':return [t,t];
  case 'semana':{const w=weekStartK(t);return [w,addDays(w,6)];}
  case 'semanaPassada':{const w=addDays(weekStartK(t),-7);return [w,addDays(w,6)];}
  case 'mes':return [t.slice(0,8)+'01',t];
  case '30d':return [addDays(t,-29),t];
  default:return ['2000-01-01','2999-12-31'];}}
function calc(a,b,resp){
  const L=leads().filter(l=>!resp||l.resp===resp);
  const inv=resp?[]:S.invest.filter(i=>i.data>=a&&i.data<=b);
  const invest=sum(inv,'valor'),captados=sum(inv,'leads');
  const criados=L.filter(l=>inK(l.criadoEm,a,b));
  const mqlL=criados.filter(l=>l.qualif==='mql'||l.qualif==='super');
  const m=k=>L.filter(l=>l.marcos&&inK(l.marcos[k],a,b));
  const ga=m('ganho');
  return {invest,captados,leadsN:captados||criados.length,criados,mql:mqlL.length,sup:criados.filter(l=>l.qualif==='super').length,
    ag:m('agendado').length,co:m('compareceu').length,ns:m('noshow').length,vendas:ga.length,fat:sum(ga,'valor'),ganhos:ga,perdidos:m('perdido')};
}
function autoDia(v,d){
  const L=leads().filter(l=>l.resp===v);
  const m=k=>L.filter(l=>l.marcos&&dk(l.marcos[k])===d);
  let mov=0,notas=0;
  for(const l of L)for(const h of (l.hist||[]))if(dk(h.em)===d){if(h.tipo==='etapa')mov++;else if(h.tipo==='nota')notas++;}
  const ga=m('ganho');
  return {novos:L.filter(l=>dk(l.criadoEm)===d).length,mov,notas,ag:m('agendado').length,co:m('compareceu').length,ns:m('noshow').length,
    vendas:ga.length,fat:sum(ga,'valor'),perdidos:m('perdido')};
}
function checkCond(p,parc,vp,ent){
  const out=[];if(!p)return out;const total=ent+parc*vp;
  if(p.parcelaMin&&vp>0&&vp<p.parcelaMin)out.push('Parcela de '+fmtR(vp)+' abaixo do mínimo de '+fmtR(p.parcelaMin)+'.');
  if(p.parcelasMax&&parc>p.parcelasMax)out.push(parc+' parcelas, acima do máximo de '+p.parcelasMax+'.');
  if(p.ticket&&total>0&&total<p.ticket)out.push('Total de '+fmtR(total)+' abaixo do ticket de '+fmtR(p.ticket)+' ('+fmtP(1-total/p.ticket)+' de desconto).');
  return out;
}

function statusMeta(v,m){if(m.real<=0&&m.min<=0)return ['','Sem meta definida'];if(v<m.min)return ['bad','Abaixo do mínimo'];if(v<m.real)return ['warn','Entre mínimo e meta'];if(m.oti>0&&v>=m.oti)return ['super','Otimista batida'];return ['good','Meta batida'];}
function vMetas(){
  const c=cfg(),ws=S.semana,we=addDays(ws,6),t=todayK();
  const atual=ws===weekStartK(t),passada=we<t;
  const dias=atual?Math.min(7,Math.round((kDate(t)-kDate(ws))/864e5)+1):passada?7:0;
  const tot=calc(ws,we,null);
  let h=vh('Metas da semana',fmtCurto(ws)+' a '+fmtCurto(we)+(atual?' · dia '+dias+' de 7':passada?' · encerrada':' · ainda não começou')+'. Mínima: não dá para fazer menos. Real: o esperado. Otimista: a semana boa.',
    '<button class="btn" data-act="semana" data-v="-7">← Anterior</button>'+(atual?'':'<button class="btn" data-act="semana" data-v="0">Esta semana</button>')+'<button class="btn" data-act="semana" data-v="7">Próxima →</button>');
  h+='<section class="block">'+METAS_DEF.map(md=>{
    const m=c.metas[md.k],v=md.calc(tot),[cls,lbl]=statusMeta(v,m);
    const max=Math.max(m.oti,m.real,m.min,v,1)*1.08,pc=x=>Math.min(100,x/max*100);
    const esperado=m.real*dias/7;
    let why='';
    if(atual&&m.real>0){why=v>=esperado?'No ritmo: o esperado até hoje era '+fmtV(esperado,md.fmt)+'.':'Atrás do ritmo: o esperado até hoje era '+fmtV(esperado,md.fmt)+'. Faltam '+fmtV(m.real-v,md.fmt)+' para a meta real.';}
    return '<div class="meta"><div class="meta-head"><h3>'+md.nome+'</h3><span class="v num">'+fmtV(v,md.fmt)+'</span></div>'
     +(m.real>0||m.min>0?'<div class="bar"><div class="fill '+cls+'" style="width:'+pc(v)+'%"></div>'
       +[['min','Mínima'],['real','Real'],['oti','Otimista']].filter(x=>m[x[0]]>0).map(x=>'<div class="mk" style="left:'+pc(m[x[0]])+'%"><span>'+x[1]+' '+fmtV(m[x[0]],md.fmt)+'</span></div>').join('')
       +(atual&&m.real>0?'<div class="pace" style="left:'+pc(esperado)+'%" title="Ritmo esperado até hoje"></div>':'')+'</div>':'')
     +'<div class="row"><span class="pill '+cls+'">'+lbl+(atual&&cls==='bad'?' (semana em andamento)':'')+'</span><span class="why">'+why+'</span></div></div>';
  }).join('')+'</section>';
  const eq=c.equipe;
  if(eq.length)h+='<section class="block"><header><h2>Por vendedor</h2><span class="hint">Conversão = vendas ÷ comparecimentos. Referência: '+c.alvos.convMin+'% a '+c.alvos.convMax+'%</span></header><div class="tbl-wrap"><table class="plain"><thead><tr><th>Vendedor</th><th class="r">Agendados</th><th class="r">Compareceram</th><th class="r">No-show</th><th class="r">Vendas</th><th class="r">Faturamento</th><th class="r">Conversão</th></tr></thead><tbody>'
    +eq.map(v=>{const x=calc(ws,we,v.id),cv=ratio(x.vendas,x.co);const ok=!Number.isFinite(cv)?'':cv*100>=c.alvos.convMin?'good':'bad';
      return '<tr><td><b>'+esc(v.nome)+'</b> <small style="color:var(--mute)">'+esc(v.papel||'')+'</small></td><td class="r">'+x.ag+'</td><td class="r">'+x.co+'</td><td class="r">'+x.ns+'</td><td class="r">'+x.vendas+'</td><td class="r">'+fmtR(x.fat)+'</td><td class="r">'+(ok?'<span class="pill '+ok+'">'+fmtP(cv)+'</span>':'—')+'</td></tr>';}).join('')
    +'</tbody></table></div></section>';
  const sem=S.semanas[ws]||{};
  const abaixo=tot.vendas<c.metas.vendas.min;
  h+='<section class="block"><header><h2>'+(abaixo?'Por que não bateu?':'Leitura da semana')+'</h2><span class="hint">O comercial explica, sem você precisar pedir</span></header>'
   +(abaixo&&(passada||atual)?'<div class="alert bad">Vendas abaixo do mínimo de '+c.metas.vendas.min+'. Escreva o motivo e o que muda na próxima semana.</div>':'')
   +'<label class="f">Motivo e plano<textarea id="sf-justificativa" data-sf="justificativa" placeholder="Ex.: 40% de no-show nas sessões de terça. Mudança: confirmar por áudio 2 h antes."'+ro()+'>'+esc(sem.justificativa||'')+'</textarea></label>'
   +(sem.atualizadoEm?'<p class="hint">Atualizado '+fmtQuando(sem.atualizadoEm)+' por '+esc(quemUid(sem.uid))+'</p>':'')+'</section>';
  return h;
}

  return '<div class="stat"><span class="k">'+lbl+'</span><span class="v">'+fmtR(v)+'</span><span class="s">'+(chip||sub||'')+'</span></div>';
}

function parseLista(txt){
  const ls=txt.split(/\r?\n/).filter(x=>x.trim());if(!ls.length)return [];
  const f=ls[0];const sep=f.includes('\t')?'\t':(f.split(';').length>=f.split(',').length?';':',');
  const cells=r=>r.split(sep).map(x=>x.trim().replace(/^"(.*)"$/,'$1').trim());
  const head=cells(f).map(norm);
  const find=keys=>head.findIndex(h=>keys.some(k=>h===k||h.includes(k)));
  const mp={nome:find(['nome','name']),tel:find(['whatsapp','telefone','celular','phone','fone','tel']),email:find(['e-mail','email']),insta:find(['instagram','insta']),origem:find(['origem','utm_source','fonte','source']),campanha:find(['campanha','utm_campaign','campaign']),qual:find(['qualifica','classifica','mql','perfil','status'])};
  const temHead=mp.nome>=0||mp.tel>=0||mp.email>=0;
  if(!temHead){mp.nome=0;mp.tel=1;mp.email=2;}
  return (temHead?ls.slice(1):ls).map(cells).map(c=>{
    const g=i=>i>=0?(c[i]||''):'';const q=norm(g(mp.qual));
    return {nome:g(mp.nome),tel:g(mp.tel),email:g(mp.email),insta:g(mp.insta),origem:g(mp.origem),campanha:g(mp.campanha),qualif:q.includes('super')?'super':(q.includes('mql')||q.includes('qualific')||q==='sim')?'mql':(q.includes('lead')||q.includes('nao'))?'lead':''};
  }).filter(o=>o.nome||o.tel||o.email);
}

  if(d.cfg){
    const c=clone(cfg());let v=t.value;if(t.type==='number')v=num(v);if(t.type==='checkbox')v=t.checked;
    setPath(c,d.cfg,v);saveCfg(c);return;
  }
  if(d.cfglist){const c=clone(cfg());c[d.cfglist]=t.value.split(/\n/).map(x=>x.trim()).filter(Boolean);saveCfg(c);return;}
  if(d.rf){saveRel(relIdAtual(),{[d.rf]:t.type==='number'?num(t.value):t.value});return;}
  if(d.sf){saveSem(t.value);return;}
  if(d.ui){
    const p=d.ui;
    if(p.startsWith('f.'))S.f[p.slice(2)]=t.value;
    else{S[p]=t.value;if(p==='quem')lsSet('quem',t.value);}
    if(p==='relData'&&!t.value)S.relData=todayK();
    renderMain();return;
  }
  if(t.closest('#condForm'))updateCond();
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='busca'){S.f.q=t.value;const box=document.getElementById('leadsTable');if(box)box.innerHTML=leadsTable();return;}
  if(d.rf&&t.tagName==='TEXTAREA'){const id=relIdAtual(),k=d.rf,v=t.value;debounce('rf'+k,()=>saveRel(id,{[k]:v}),1200);return;}
  if(d.sf){const v=t.value;debounce('sf',()=>saveSem(v),1200);return;}
  if(t.closest('#condForm'))updateCond();
  if(t.id==='imp-txt'){const n=parseLista(t.value).length;document.getElementById('imp-prev').textContent=n?n+' lead(s) encontrados'+(n>500?' (importo os primeiros 500)':''):'';}
});
let lastSem='';
function saveSem(v){const ws=S.semana;const key=ws+'|'+v;if(key===lastSem)return;lastSem=key;S.semanas[ws]={...(S.semanas[ws]||{}),justificativa:v};saveDoc('semanas/'+ws,{ws,justificativa:v,atualizadoEm:nowIso(),uid:S.uid||null},'set');}
// arrastar e soltar no funil
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();document.querySelectorAll('.col.drop').forEach(c=>c!==col&&c.classList.remove('drop'));col.classList.add('drop');});
document.addEventListener('dragleave',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drop');});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();col.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');const et=col.dataset.etapa;const l=leadById(id);if(!l||l.etapa===et||!S.canWrite)return;if(FECHADAS.includes(et))openDrawer(id,et);else moveStage(id,et);});

/* ---------- contas e acesso ---------- */
async function conta(body){
  try{
    const {data:{session}}=await S.sb.auth.getSession();
    const h={'Content-Type':'application/json',apikey:SB_KEY};if(session)h.Authorization='Bearer '+session.access_token;
    const r=await fetch(SB_URL+'/functions/v1/cc-conta',{method:'POST',headers:h,body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){if(body.acao!=='setup')toast(j.erro||'Não deu certo. Tente de novo.','bad');return {...j,ok:false};}
    return j;
  }catch(e){toast('Sem conexão com o servidor.','bad');return {ok:false,erro:'Sem conexão com o servidor.'};}
}
function modalPessoa(idx){
  const v=idx!=null?cfg().equipe[idx]:null;
  modal('<h2>'+(v?'Criar acesso para '+esc(v.nome||'a pessoa'):'Adicionar pessoa à equipe')+'</h2><form id="pessoaForm" data-idx="'+(idx==null?'':idx)+'" style="display:flex;flex-direction:column;gap:12px"><div class="fields">'
   +'<label class="f">Nome<input id="pf-nome" required value="'+esc(v?v.nome:'')+'"></label>'
   +'<label class="f">Papel<select id="pf-papel">'+optList(['SDR','Closer','Gerente'],v?v.papel:'Closer')+'</select></label>'
   +'<label class="f">E-mail de acesso<input id="pf-email" type="email" required autocomplete="off"></label>'
   +'<label class="f">Senha provisória<input id="pf-senha" type="text" minlength="8" required autocomplete="off"></label></div>'
   +'<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input id="pf-admin" type="checkbox" style="width:auto">Administrador (cria acessos e vê o webhook)</label>'
   +'<p class="hint">Passe o e-mail e a senha provisória para a pessoa por um canal privado. Ela troca a senha depois em Ajustes.</p>'
   +'<div class="row"><button class="btn pri" type="submit" id="pf-btn">Criar acesso</button><button class="btn ghost" type="button" data-act="fecharModal">Cancelar</button></div></form>');
}
async function doPessoa(f){
  const g=id=>document.getElementById(id).value.trim();const idx=f.dataset.idx;
  const body={acao:'criar',nome:g('pf-nome'),papel:g('pf-papel'),email:g('pf-email'),senha:document.getElementById('pf-senha').value,admin:document.getElementById('pf-admin').checked};
  const b=document.getElementById('pf-btn');b.disabled=true;b.textContent='Criando…';
  const r=await conta(body);b.disabled=false;b.textContent='Criar acesso';if(!r.ok)return;
  const c=clone(cfg());
  if(idx!==''&&c.equipe[+idx])Object.assign(c.equipe[+idx],{nome:body.nome,papel:body.papel,uid:r.user_id});
  else{const ja=c.equipe.find(v=>v.uid===r.user_id);if(ja)Object.assign(ja,{nome:body.nome,papel:body.papel});else c.equipe.push({id:r.user_id,nome:body.nome,papel:body.papel,uid:r.user_id});}
  saveCfg(c);modal('');carregarMembros();
  toast(r.existente?'Esse e-mail já tinha conta: a pessoa entra com a senha que já usa.':'Acesso criado. Passe o e-mail e a senha para '+body.nome+'.');
}
async function doSenha(f){const r=await conta({acao:'senha',user_id:f.dataset.uid,senha:document.getElementById('ns-1').value});if(r.ok){modal('');toast('Senha trocada.');}}
async function doMinhaSenha(){
  const a=document.getElementById('ms-1').value,b=document.getElementById('ms-2').value;
  if(a!==b){toast('As senhas não são iguais.','bad');return;}
  const {error}=await S.sb.auth.updateUser({password:a});
  if(error){toast(/different|same/i.test(error.message)?'Use uma senha diferente da atual.':'Não consegui trocar a senha.','bad');return;}
  modal('');toast('Senha trocada.');
}
function renderAuth(modo,info){
  document.getElementById('app').hidden=true;const a=document.getElementById('auth');a.hidden=false;
  const marca='<div class="brand"><b>Central Comercial</b><span>Do lead à venda, todo dia</span></div>';
  if(modo==='semacesso'){a.innerHTML='<div class="auth-box">'+marca+'<h1>Sem acesso</h1><p class="hint">A conta '+esc(info||'')+' não está liberada na Central. Peça ao administrador para criar ou reativar seu acesso.</p><div><button class="btn" data-act="sair">Sair</button></div></div>';return;}
  if(modo==='setup'){a.innerHTML='<div class="auth-box">'+marca+'<h1>Primeiro acesso</h1><p class="hint">Use o código de configuração para criar a conta do administrador. Ele só vale uma vez.</p><form id="setupForm" class="auth-form"><label class="f">Código de configuração<input id="su-cod" required autocomplete="off" style="text-transform:uppercase"></label><label class="f">Seu nome<input id="su-nome" required autocomplete="name"></label><label class="f">E-mail<input id="su-email" type="email" required autocomplete="username"></label><label class="f">Senha (8 ou mais caracteres)<input id="su-senha" type="password" minlength="8" required autocomplete="new-password"></label><div id="authMsg"></div><button class="btn pri" type="submit" id="su-btn">Criar conta de administrador</button><button class="link" type="button" data-act="verLogin">Já tenho conta</button></form></div>';return;}
  a.innerHTML='<div class="auth-box">'+marca+'<h1>Entrar</h1><form id="loginForm" class="auth-form"><label class="f">E-mail<input id="li-email" type="email" required autocomplete="username"></label><label class="f">Senha<input id="li-senha" type="password" required autocomplete="current-password"></label><div id="authMsg"></div><button class="btn pri" type="submit" id="li-btn">Entrar</button><p class="hint">Esqueceu a senha? Peça ao administrador para criar uma nova.</p><button class="link" type="button" data-act="verSetup">Primeiro acesso do administrador</button></form></div>';
}
function authMsg(t){const m=document.getElementById('authMsg');if(m)m.innerHTML='<div class="alert bad">'+esc(t)+'</div>';}
async function doLogin(){
  const b=document.getElementById('li-btn');b.disabled=true;
  const {error}=await S.sb.auth.signInWithPassword({email:document.getElementById('li-email').value.trim(),password:document.getElementById('li-senha').value});
  b.disabled=false;if(error)authMsg(/invalid login/i.test(error.message)?'E-mail ou senha errados.':'Não consegui entrar: '+error.message);
}
async function doSetup(){
  const g=id=>document.getElementById(id).value;const b=document.getElementById('su-btn');b.disabled=true;
  const email=g('su-email').trim(),senha=g('su-senha');
  const r=await conta({acao:'setup',codigo:g('su-cod'),nome:g('su-nome').trim(),email,senha});
  if(!r.ok){b.disabled=false;authMsg(r.erro||'Não deu certo.');return;}
  await S.sb.auth.signInWithPassword({email,password:senha});
}

/* ---------- conexão (Supabase) ---------- */
const SB_URL='https://rtiuerncqbnucgqdzmbe.supabase.co';
const SB_KEY='sb_publishable_XJHM4yZ-LdSvmYb2Q-liWQ_PfMKiUVv';
const whUrl=t=>SB_URL+'/functions/v1/cc-webhook?k='+t;
const store={};
function localSet(col,id,doc){(store[col]||(store[col]=new Map())).set(id,{...doc,id});}
function localMerge(col,id,patch){const m=store[col];const cur=m&&m.get(id);if(cur)m.set(id,{...cur,...patch,id});}
function localDel(col,id){const m=store[col];if(m)m.delete(id);}
const vals=c=>[...(store[c]||new Map()).values()];
function derive(){
  const g=(store.config||new Map()).get('geral');
  if(g){const {id,...rest}=g;S.config=rest;}else S.config=null;
  const L=vals('leads');S.leadsA=L.filter(l=>l.aberto!==false);S.leadsF=L.filter(l=>l.aberto===false);
  S.invest=vals('investimento').sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  S.rels=vals('relatorios');
  S.aprov=vals('aprovacoes').sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm)));
  S.semanas=Object.fromEntries(vals('semanas').map(d=>[d.id,d]));
  S.sistema=Object.fromEntries(vals('sistema').map(d=>[d.id,d]));
}
const limpa=d=>{const o={...d};delete o.id;return o;};
async function exec(p){const {error}=await p;if(error)throw {code:(error.code==='42501'||/row-level|permission/i.test(error.message||''))?'invalid_argument':'unavailable',message:error.message};}
function mkDb(sb){
  const doc=path=>{const i=path.indexOf('/');const col=path.slice(0,i),id=path.slice(i+1);return {id,
    set:d=>{d=limpa(d);localSet(col,id,d);derive();rerender();return exec(sb.from('cc_docs').upsert({col,id,doc:d}));},
    update:p=>{p=limpa(p);localMerge(col,id,p);derive();rerender();return exec(sb.rpc('cc_patch',{p_col:col,p_id:id,p_patch:p}));},
    delete:()=>{localDel(col,id);derive();rerender();return exec(sb.from('cc_docs').delete().eq('col',col).eq('id',id));}};};
  const novoId=()=>((window.crypto&&crypto.randomUUID)?crypto.randomUUID():rid()+rid()+rid()).replace(/-/g,'').slice(0,20);
  return {doc,collection:col=>({doc:id=>doc(col+'/'+(id||novoId())),add:d=>{const r=doc(col+'/'+novoId());return r.set(d).then(()=>r);}})};
}
async function carregarTudo(){
  const novo={};let from=0;
  for(;;){
    const {data,error}=await S.sb.from('cc_docs').select('col,id,doc').order('col').order('id').range(from,from+999);
    if(error)throw error;
    for(const r of data)(novo[r.col]||(novo[r.col]=new Map())).set(r.id,{...r.doc,id:r.id});
    if(data.length<1000)break;from+=1000;
  }
  for(const k of Object.keys(store))delete store[k];Object.assign(store,novo);
  derive();S.status='ok';renderAll();
}
async function carregarMembros(){
  const {data}=await S.sb.from('cc_membros').select('*').order('nome');S.membros=data||[];
  const me=S.membros.find(m=>m.user_id===S.uid);if(me)S.eu=me;rerender();
}
let canal=null,iniciado=false;
function avisoSuper(l){toast('Novo Super MQL: '+(l.nome||'sem nome')+'. Chamar agora.');try{document.title='● Super MQL · Central Comercial';setTimeout(()=>{document.title='Central Comercial';},20000);}catch(e){}}
async function iniciar(session){
  if(iniciado&&S.uid===session.user.id)return;
  iniciado=true;S.uid=session.user.id;
  const {data:me,error}=await S.sb.from('cc_membros').select('*').eq('user_id',S.uid).maybeSingle();
  if(error||!me||!me.ativo){iniciado=false;renderAuth('semacesso',session.user.email);return;}
  S.eu=me;S.db=mkDb(S.sb);S.status='carregando';
  document.getElementById('auth').hidden=true;document.getElementById('app').hidden=false;
  setView();
  try{await carregarTudo();}catch(e){S.status='offline';renderAll();}
  carregarMembros();
  if(me.admin)S.sb.rpc('cc_webhook_token').then(({data})=>{if(data){S.webhookUrl=whUrl(data);rerender();}});
  if(canal)S.sb.removeChannel(canal);
  canal=S.sb.channel('cc-'+S.uid)
    .on('postgres_changes',{event:'*',schema:'public',table:'cc_docs'},p=>{
      if(p.eventType==='DELETE'){if(p.old&&p.old.col)localDel(p.old.col,p.old.id);}
      else{const r=p.new;const antes=store[r.col]&&store[r.col].get(r.id);localSet(r.col,r.id,r.doc);if(r.col==='leads'&&!antes&&r.doc&&r.doc.qualif==='super')avisoSuper(r.doc);}
      derive();rerender();})
    .on('postgres_changes',{event:'*',schema:'public',table:'cc_membros'},()=>carregarMembros())
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){if(S.status==='offline')carregarTudo().catch(()=>{});else{S.status='ok';renderNav();}}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){S.status='offline';renderAll();}
    });
}
function parar(){
  iniciado=false;if(canal&&S.sb){S.sb.removeChannel(canal);canal=null;}
  S.db=null;S.eu=null;S.uid=null;S.webhookUrl='';S.membros=[];for(const k of Object.keys(store))delete store[k];derive();
  S.drawer=null;renderDrawer();modal('');
}
function boot(){
  if(!window.supabase||!window.supabase.createClient){const a=document.getElementById('auth');a.hidden=false;a.innerHTML='<div class="auth-box"><h1>Sem conexão</h1><p class="hint">Não consegui carregar a biblioteca do servidor. Verifique a internet e recarregue a página.</p></div>';return;}
  S.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  S.sb.auth.onAuthStateChange((ev,session)=>{
    if(!session){parar();renderAuth('login');return;}
    if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')setTimeout(()=>iniciar(session),0);
  });
}
boot();
})();
